name: smartwater
description: "Application mobile SmartWater - irrigation intelligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Authentification + base de donnees (Supabase)
  supabase_flutter: ^2.5.6

  # Graphiques (courbe d'humidite, etc.)
  fl_chart: ^0.68.0

  # Appel a l'API Django backend
  http: ^1.2.1

  # Notifications push (Firebase Cloud Messaging)
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2

  # Gestion d'etat simple
  provider: ^6.1.2

  # Format des dates en francais
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

  # Icone de l'application -- genere avec le package flutter_launcher_icons
  # (voir docs/DEPLOIEMENT.md, section "Generer l'icone de l'app")
